<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internet Explorer 8</title>
<style>
/* ===================== BODY & BROWSER ===================== */
body {
  margin:0;
  font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
  background:#808080;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.browser {
  width:90%;
  height:85vh;
  display:flex;
  flex-direction:column;
  border:2px solid #808080;
  background:#c0c0c0;
  box-shadow:3px 3px 8px rgba(0,0,0,0.3);
}

/* ===================== TITLE BAR ===================== */
.title-bar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:2px 6px;
  background: linear-gradient(to bottom,#e4e4e4,#c0c0c0);
  border-bottom:1px solid #808080;
  font-weight:bold;
  user-select: none;
}
.title-bar-left {
  display: flex;
  align-items: center;
}
.title-bar-left img {
  width:16px;
  height:16px;
  margin-right:4px;
}
#protected-indicator {
  display: none;
  margin-left: 6px;
  color: #f0a500;
  font-weight: bold;
  font-size: 12px;
}

/* ===================== WINDOW BUTTONS ===================== */
.title-bar-buttons button {
  width: 24px;
  height: 20px;
  margin-left: 2px;
  font-weight: bold;
  font-size: 12px;
  text-align: center;
  cursor: pointer;
  border: 1px solid #808080;
  border-top-color: #fff;
  border-left-color: #fff;
  border-bottom-color: #404040;
  border-right-color: #404040;
  background: #c0c0c0;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: inset 0 1px 0 #fff;
}
.title-bar-buttons button:hover { background: #e0e0e0; }
.title-bar-buttons button:active {
  border-top-color:#404040;
  border-left-color:#404040;
  border-bottom-color:#fff;
  border-right-color:#fff;
  background:#a0a0a0;
}
.title-bar-buttons button.close:hover {
  background:#e81123;
  color:#fff;
  border-top-color:#a50e1b;
  border-left-color:#a50e1b;
  border-bottom-color:#600a10;
  border-right-color:#600a10;
  box-shadow: inset 0 1px 0 #fff, inset 0 -1px 0 #600a10;
}

/* ===================== MENU BAR ===================== */
.menu-bar {
  display: flex;
  padding: 2px 6px;
  background: #f0f0f0;
  border-bottom: 1px solid #808080;
}
.menu-bar span {
  margin-right: 12px;
  cursor: default;
  font-size: 12px;
}

/* ===================== TOOLBAR ===================== */
.toolbar {
  display: flex;
  align-items: center;
  padding: 2px 4px;
  background: #e6e6e6;
  border-bottom: 2px solid #808080;
}
.toolbar button {
  margin-right: 4px;
  font-size: 12px;
  cursor: pointer;
}
.toolbar input.address-bar {
  flex: 1;
  padding: 2px;
  margin-right: 4px;
  font-size: 12px;
}

/* ===================== SEARCH BOX ===================== */
.search-box {
  display: flex;
  align-items: center;
  border: 1px solid #808080;
  background: #fff;
  padding: 0 4px;
  margin-right: 4px;
}
.search-box img {
  width: 16px;
  height: 16px;
  margin-right: 4px;
}
.search-box input {
  border: none;
  outline: none;
  width: 120px;
  font-size: 12px;
}
.search-box button {
  margin-left: 4px;
  font-size: 12px;
  cursor: pointer;
}

/* ===================== EXTENSIONS MENU ===================== */
#extensions-menu {
  display: none;
  position: absolute;
  background:#e0e0e0;
  border:1px solid #808080;
  padding:4px;
  font-size:12px;
  z-index:100;
}
#extensions-menu .extension-item {
  padding:2px 6px;
  cursor: pointer;
}
#extensions-menu .extension-item:hover { background:#c0c0c0; }

/* ===================== NAV BUTTONS ===================== */
.nav-btn {
  padding: 0;
  width: 28px;
  height: 28px;
  border: none;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
}
.nav-btn svg { transition: all 0.2s; }
.nav-btn:hover svg circle { fill: #d0d0d0; }

/* ===================== TABS ===================== */
.tabs {
  display: flex;
  border-bottom: 2px solid #808080;
  background: #e0e0e0;
  overflow-x: auto;
}
.tab {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 8px;
  margin-right: 2px;
  border: 1px solid #808080;
  border-bottom: none;
  background: #d0d0d0;
  cursor: pointer;
  font-size: 12px;
  transition: background 0.2s;
}
.tab:hover { background: #e8e8e8; }
.tab.active { background: #fff; font-weight: bold; }
.tab .close-btn { margin-left: 4px; cursor: pointer; font-weight: bold; }
.tab .close-btn:hover { color: red; }

/* ===================== CONTENT ===================== */
.content {
  flex: 1;
  border-top: none;
  overflow: hidden;
}
.content iframe { width: 100%; height: 100%; border: none; }

/* ===================== INPRIVATE MODE ===================== */
body.inprivate .browser {
  filter: brightness(0.9) contrast(1.1);
}

/* ===================== SCROLLBARS ===================== */
.tabs::-webkit-scrollbar { height: 8px; }
.tabs::-webkit-scrollbar-thumb { background: #999; border-radius: 4px; }
.tabs::-webkit-scrollbar-track { background: #eee; border-radius: 4px; }

</style>
</head>
<body>

<div class="browser">
  <!-- TITLE BAR -->
  <div class="title-bar">
    <div class="title-bar-left">
      <img src="https://1000logos.net/wp-content/uploads/2020/08/Internet-Explorer-Logo-2005.png" alt="IE8 Icon">
      Windows Internet Explorer
      <span id="protected-indicator">🔒 Protected Mode</span>
    </div>
    <div class="title-bar-buttons">
      <button class="minimize" title="Minimize">_</button>
      <button class="maximize" title="Maximize">□</button>
      <button class="close" title="Close">X</button>
    </div>
  </div>

  <!-- MENU BAR -->
  <div class="menu-bar">
    <span>File</span><span>Edit</span><span>View</span>
    <span>Favorites</span><span>Tools</span><span>Help</span>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <button id="back-btn" class="nav-btn" title="Back">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="11" stroke="#808080" stroke-width="2" fill="#e0e0e0"/>
        <polygon points="14,6 8,12 14,18" fill="#333"/>
      </svg>
    </button>
    <button id="forward-btn" class="nav-btn" title="Forward">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="11" stroke="#808080" stroke-width="2" fill="#e0e0e0"/>
        <polygon points="10,6 16,12 10,18" fill="#333"/>
      </svg>
    </button>
    <button id="refresh-btn">Refresh</button>
    <button id="home-btn">Home</button>
    <button id="newtab-btn">New Tab</button>

    <input type="text" id="address-bar" class="address-bar" value="https://www.google.com/webhp?igu=1&safe=active&ssui=on">

    <div class="search-box">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/Google_Icon_%282010-2015%29.svg/960px-Google_Icon_%282010-2015%29.svg.png" alt="Google">
      <input type="text" id="search-input" placeholder="Search">
      <button id="search-btn">Go</button>
    </div>

    <button id="inprivate-btn">InPrivate</button>
    <button id="extensions-btn">Extensions ▼</button>
    <div id="extensions-menu">
      <div class="extension-item" data-extension="infinite-security">Infinite-Security</div>
      <div class="extension-item" data-extension="ie6-mode">IE 6-Mode</div>
      <div class="extension-item" data-extension="developer-tools">Developer-Tools</div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs" id="tabs">
    <div class="tab active" data-url="https://www.google.com/webhp?igu=1&safe=active&ssui=on">
      <span class="title">Google</span>
      <span class="close-btn">&times;</span>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content" id="tab-content">
    <iframe id="main-iframe" src="https://www.google.com/webhp?igu=1&safe=active&ssui=on"></iframe>
  </div>
</div>

<script>
// ===================== REFERENCES =====================
const iframe = document.getElementById('main-iframe');
const tabsContainer = document.getElementById('tabs');
const addressBar = document.getElementById('address-bar');
const searchInput = document.getElementById('search-input');
const inPrivateBtn = document.getElementById('inprivate-btn');
const protectedIndicator = document.getElementById('protected-indicator');
const extensionsBtn = document.getElementById('extensions-btn');
const extensionsMenu = document.getElementById('extensions-menu');

let tabHistory = [{back:[], forward:[], url:"https://www.google.com/webhp?igu=1&safe=active&ssui=on", label:"Google"}];
let activeTabIndex = 0;

// ===================== TAB UPDATE =====================
function updateTab(){
  const tab = tabsContainer.children[activeTabIndex];
  tab.dataset.url = tabHistory[activeTabIndex].url;
  tab.querySelector('.title').textContent = tabHistory[activeTabIndex].label;
  iframe.src = tabHistory[activeTabIndex].url;
  addressBar.value = tabHistory[activeTabIndex].url;
  Array.from(tabsContainer.children).forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
}

// ===================== ADDRESS BAR =====================
addressBar.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    let url = addressBar.value.trim();
    if(!url.startsWith('http')) url='https://'+url;
    let h=tabHistory[activeTabIndex];
    h.back.push(h.url);
    h.forward=[];
    h.url=url;
    updateTab();
  }
});

// ===================== SEARCH BOX =====================
document.getElementById('search-btn').addEventListener('click', () => {
  const q = searchInput.value.trim();
  if (!q) return;
  let h=tabHistory[activeTabIndex];
  h.back.push(h.url);
  h.forward=[];
  h.url=`https://www.google.com/search?q=${encodeURIComponent(q)}`;
  updateTab();
});
searchInput.addEventListener('keydown', e => {
  if(e.key==='Enter') document.getElementById('search-btn').click();
});

// ===================== TAB CLICK/CLOSE =====================
tabsContainer.addEventListener('click', e=>{
  const tab = e.target.closest('.tab'); if(!tab) return;
  const idx = Array.from(tabsContainer.children).indexOf(tab);
  if(e.target.classList.contains('close-btn')){
    if(tabsContainer.children.length===1) return;
    tabHistory.splice(idx,1); tabsContainer.removeChild(tab);
    if(activeTabIndex>=idx) activeTabIndex=Math.max(0,activeTabIndex-1);
    updateTab(); return;
  }
  activeTabIndex=idx; updateTab();
});

// ===================== NEW TAB =====================
document.getElementById('newtab-btn').addEventListener('click', ()=>{
  const newTab = document.createElement('div'); newTab.classList.add('tab');
  newTab.innerHTML = '<span class="title">New Tab</span><span class="close-btn">&times;</span>';
  tabsContainer.appendChild(newTab);
  tabHistory.push({back:[], forward:[], url:"https://example.com", label:"New Tab"});
  activeTabIndex = tabHistory.length-1; updateTab();
});

// ===================== NAVIGATION =====================
document.getElementById('back-btn').addEventListener('click', ()=>{ const h=tabHistory[activeTabIndex]; if(h.back.length){h.forward.push(h.url); h.url=h.back.pop(); updateTab(); }});
document.getElementById('forward-btn').addEventListener('click', ()=>{ const h=tabHistory[activeTabIndex]; if(h.forward.length){h.back.push(h.url); h.url=h.forward.pop(); updateTab(); }});
document.getElementById('refresh-btn').addEventListener('click', ()=>updateTab());
document.getElementById('home-btn').addEventListener('click', ()=>{ const h=tabHistory[activeTabIndex]; h.back.push(h.url); h.forward=[]; h.url="https://www.google.com/webhp?igu=1&safe=active&ssui=on"; updateTab(); });

// ===================== INPRIVATE & PROTECTED MODE =====================
inPrivateBtn.addEventListener('click', () => {
  const inprivate = document.body.classList.toggle('inprivate');
  protectedIndicator.style.display = inprivate ? 'inline-block' : 'none';
});

// ===================== EXTENSIONS MENU =====================
extensionsBtn.addEventListener('click', () => {
  extensionsMenu.style.display = extensionsMenu.style.display === 'none' ? 'block' : 'none';
});
document.addEventListener('click', (e) => {
  if (!extensionsBtn.contains(e.target) && !extensionsMenu.contains(e.target)) extensionsMenu.style.display='none';
});
document.querySelectorAll('.extension-item').forEach(item => {
  item.addEventListener('click', () => {
    const ext = item.dataset.extension;
    switch(ext){
      case 'infinite-security':
        alert("Infinite-Security enabled: Protected Mode stability enhanced!");
        document.body.classList.add('protected-enhanced');
        break;
      case 'ie6-mode':
        alert("IE 6-Mode enabled! Tabs and InPrivate disabled.");
        document.querySelector('.title-bar-left img').src = 
          "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnBOK8_lUF3oXhB7eLeuEIwzRUTFvJGQOCH-wA6GW8Klc3dDXhwk7SDBBaSaLmWC8wfD6cKw&s";
        tabsContainer.style.pointerEvents = 'none';
        document.getElementById('inprivate-btn').disabled = true;
        break;
      case 'developer-tools':
        alert("Developer-Tools enabled! JS console button added.");
        if(!document.getElementById('console-btn')){
          const consoleBtn = document.createElement('button');
          consoleBtn.id = 'console-btn';
          consoleBtn.innerText = 'Console';
          consoleBtn.style.marginLeft = '4px';
          consoleBtn.addEventListener('click', () => {
            console.log("Developer console opened (simulated).");
            alert("JavaScript console (simulated) opened!");
          });
          document.querySelector('.toolbar').insertBefore(consoleBtn, document.getElementById('newtab-btn').nextSibling);
        }
        break;
    }
    extensionsMenu.style.display = 'none';
  });
});
</script>
</body>
</html>
