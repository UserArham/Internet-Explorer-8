<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internet Explorer 8</title>
<link rel="stylesheet" href="https://unpkg.com/xp.css">
<style>
/* Body & Browser */
body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background: #808080;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.browser {
  width: 90%;
  height: 80vh;
  display: flex;
  flex-direction: column;
  border: 2px solid #808080;
  background: #c0c0c0;
  box-shadow: 3px 3px 8px rgba(0,0,0,0.3);
}

/* Title Bar */
.title-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 6px;
  background: linear-gradient(to bottom,#e0e0e0,#c0c0c0);
  border-bottom: 1px solid #808080;
  font-weight: bold;
}
.title-bar-left {
  display: flex;
  align-items: center;
}
.title-bar-left img {
  width:16px;
  height:16px;
  margin-right:4px;
}

/* Windows XP-style title bar buttons */
.title-bar-buttons {
  display: flex;
}
.title-bar-buttons button {
  width: 24px; height: 20px; margin-left: 2px;
  font-weight: bold; font-size: 12px; text-align: center; cursor: pointer;

  /* XP-style 3D borders */
  border-top: 1px solid #fff;
  border-left: 1px solid #fff;
  border-bottom: 1px solid #404040;
  border-right: 1px solid #404040;

  background: linear-gradient(to bottom,#e0e0e0,#c0c0c0);
  display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 1px 0 #fff;
  user-select: none;
}
.title-bar-buttons button:hover { background:#e0e0e0; }
.title-bar-buttons button:active {
  border-top: 1px solid #404040;
  border-left: 1px solid #404040;
  border-bottom: 1px solid #fff;
  border-right: 1px solid #fff;
  background: #a0a0a0;
}
.title-bar-buttons button.close:hover {
  background:#e81123;
  color:#fff;
  border-top-color:#a50e1b;
  border-left-color:#a50e1b;
  border-bottom-color:#600a10;
  border-right-color:#600a10;
}

/* Menu Bar */
.menu-bar {
  display: flex;
  padding: 2px 6px;
  background: #f0f0f0;
  border-bottom: 1px solid #808080;
}
.menu-bar span {
  margin-right: 12px;
  cursor: default;
  font-size: 12px;
}

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  padding: 2px 4px;
  background: #c0c0c0;
  border-bottom: 2px solid #808080;
}
.toolbar button {
  margin-right: 4px;
}
.toolbar input.address-bar {
  flex: 1;
  padding: 2px;
  margin-right: 4px;
}

/* Google search box */
.search-box {
  display:flex;
  align-items:center;
  border:1px solid #808080;
  background:#fff;
  padding:0 4px;
  margin-right:4px;
}
.search-box img {
  width:16px;
  height:16px;
  margin-right:4px;
}
.search-box input {
  border:none;
  outline:none;
  width:120px;
  font-size:12px;
}
.search-box button {
  margin-left:4px;
  font-size:12px;
  cursor:pointer;
}

/* Circular SVG navigation buttons */
.nav-btn {
  padding:0; width:28px; height:28px; border:none;
  background:transparent; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.nav-btn svg { transition:all 0.2s; }
.nav-btn:hover svg circle { fill:#d0d0d0; }

/* Tabs */
.tabs {
  display:flex;
  border-bottom:2px solid #808080;
  background:#e0e0e0;
  overflow-x:auto;
}
.tab {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:4px 8px;
  margin-right:2px;
  border:1px solid #808080;
  border-bottom:none;
  background:#d0d0d0;
  cursor:pointer;
  font-size:12px;
  transition:background 0.2s;
}
.tab:hover { background:#e8e8e8; }
.tab.active { background:#fff; font-weight:bold; }
.tab .close-btn { margin-left:4px; cursor:pointer; font-weight:bold; }
.tab .close-btn:hover { color:red; }

/* Content */
.content {
  flex:1;
  border-top:none;
  overflow:hidden;
}
.content iframe { width:100%; height:100%; border:none; }

/* Scrollbar styling for tabs */
.tabs::-webkit-scrollbar { height:8px; }
.tabs::-webkit-scrollbar-thumb { background:#999; border-radius:4px; }
.tabs::-webkit-scrollbar-track { background:#eee; border-radius:4px; }

</style>
</head>
<body>

<div class="browser">
  <!-- Title bar -->
  <div class="title-bar">
    <div class="title-bar-left">
      <img src="https://1000logos.net/wp-content/uploads/2020/08/Internet-Explorer-Logo-2005.png" alt="IE Icon">
      Windows Internet Explorer
    </div>
    <div class="title-bar-buttons">
      <button class="minimize" title="Minimize">_</button>
      <button class="maximize" title="Maximize/Restore">□</button>
      <button class="close" title="Close">X</button>
    </div>
  </div>

  <!-- Menu bar -->
  <div class="menu-bar">
    <span>File</span><span>Edit</span><span>View</span><span>Favorites</span><span>Tools</span><span>Help</span>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button id="back-btn" class="nav-btn" title="Back">
      <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" stroke="#808080" stroke-width="2" fill="#e0e0e0"/><polygon points="14,6 8,12 14,18" fill="#333"/></svg>
    </button>
    <button id="forward-btn" class="nav-btn" title="Forward">
      <svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" stroke="#808080" stroke-width="2" fill="#e0e0e0"/><polygon points="10,6 16,12 10,18" fill="#333"/></svg>
    </button>
    <button id="refresh-btn">Refresh</button>
    <button id="home-btn">Home</button>
    <button id="newtab-btn">New Tab</button>

    <input type="text" id="address-bar" class="address-bar" value="https://www.google.com/webhp?igu=1&safe=active&ssui=on">

    <div class="search-box">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/Google_Icon_%282010-2015%29.svg/960px-Google_Icon_%282010-2015%29.svg.png" alt="Google">
      <input type="text" id="search-input" placeholder="Search">
      <button id="search-btn">Go</button>
    </div>

    <button id="inprivate-btn">InPrivate</button>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <div class="tab active" data-url="https://www.google.com/webhp?igu=1&safe=active&ssui=on">
      <span class="title">Google</span>
      <span class="close-btn">&times;</span>
    </div>
  </div>

  <!-- Content -->
  <div class="content" id="tab-content">
    <iframe id="main-iframe" src="https://www.google.com/webhp?igu=1&safe=active&ssui=on"></iframe>
  </div>
</div>

<script>
// References
const iframe = document.getElementById('main-iframe');
const tabsContainer = document.getElementById('tabs');
const addressBar = document.getElementById('address-bar');
const searchInput = document.getElementById('search-input');

let tabHistory = [{back:[], forward:[], url:"https://www.google.com/webhp?igu=1&safe=active&ssui=on", label:"Google"}];
let activeTabIndex = 0;

// Update tab UI
function updateTab(){
  const tab = tabsContainer.children[activeTabIndex];
  tab.dataset.url = tabHistory[activeTabIndex].url;
  tab.querySelector('.title').textContent = tabHistory[activeTabIndex].label;
  iframe.src = tabHistory[activeTabIndex].url;
  addressBar.value = tabHistory[activeTabIndex].url;
  addressBar.title = tabHistory[activeTabIndex].url;
  Array.from(tabsContainer.children).forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
}

// Update tab label from iframe title
iframe.addEventListener('load', ()=>{
  try { const title = iframe.contentDocument.title; if(title) tabHistory[activeTabIndex].label = title; updateTab(); } catch {}
});

// Address bar enter
addressBar.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    let url = addressBar.value.trim();
    if(!url.startsWith('http')) url='https://'+url;
    let h=tabHistory[activeTabIndex];
    h.back.push(h.url);
    h.forward=[];
    h.url=url;
    updateTab();
  }
});

// Search bar
document.getElementById('search-btn').addEventListener('click', () => {
  const q = searchInput.value.trim();
  if (!q) return;
  let h=tabHistory[activeTabIndex];
  h.back.push(h.url);
  h.forward=[];
  h.url=`https://www.google.com/search?q=${encodeURIComponent(q)}`;
  updateTab();
});
searchInput.addEventListener('keydown', e => {
  if(e.key==='Enter') document.getElementById('search-btn').click();
});

// Tab click/close
tabsContainer.addEventListener('click', e=>{
  const tab = e.target.closest('.tab'); if(!tab) return;
  const idx = Array.from(tabsContainer.children).indexOf(tab);
  if(e.target.classList.contains('close-btn')){
    if(tabsContainer.children.length===1) return;
    tabHistory.splice(idx,1); tabsContainer.removeChild(tab);
    if(activeTabIndex>=idx) activeTabIndex=Math.max(0,activeTabIndex-1);
    updateTab(); return;
  }
  activeTabIndex=idx; updateTab();
});

// New Tab
document.getElementById('newtab-btn').addEventListener('click', ()=>{
  const newTab = document.createElement('div'); newTab.classList.add('tab');
  newTab.innerHTML = '<span class="title">New Tab</span><span class="close-btn">&times;</span>';
  tabsContainer.appendChild(newTab);
  tabHistory.push({back:[], forward:[], url:"https://example.com", label:"New Tab"});
  activeTabIndex = tabHistory.length-1; updateTab();
});

// Navigation buttons
document.getElementById('back-btn').addEventListener('click', ()=>{ const h=tabHistory[activeTabIndex]; if(h.back.length){h.forward.push(h.url); h.url=h.back.pop(); updateTab(); }});
document.getElementById('forward-btn').addEventListener('click', ()=>{ const h=tabHistory[activeTabIndex]; if(h.forward.length){h.back.push(h.url); h.url=h.forward.pop(); updateTab(); }});
document.getElementById('refresh-btn').addEventListener('click', ()=>updateTab());
document.getElementById('home-btn').addEventListener('click', ()=>{ const h=tabHistory[activeTabIndex]; h.back.push(h.url); h.forward=[]; h.url="https://www.google.com/webhp?igu=1&safe=active&ssui=on"; updateTab(); });
document.getElementById('inprivate-btn').addEventListener('click', ()=>document.body.classList.toggle('inprivate'));

</script>
</body>
</html>
