<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internet Explorer 8</title>
<link rel="stylesheet" href="https://unpkg.com/xp.css">
<style>
body {
  margin: 0;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background-color: #808080;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}
.browser {
  width: 90%;
  height: 80vh;
  display: flex;
  flex-direction: column;
  border: 2px solid #808080;
  background-color: #c0c0c0;
  box-shadow: 3px 3px 8px rgba(0,0,0,0.3);
}
.title-bar {
  display: flex;
  align-items: center;
  padding: 2px 6px;
  background: linear-gradient(to bottom, #e0e0e0 0%, #c0c0c0 100%);
  border-bottom: 1px solid #808080;
  font-weight: bold;
}
.title-bar img { width: 16px; height: 16px; margin-right: 4px; }
.menu-bar {
  display: flex;
  padding: 2px 6px;
  background-color: #f0f0f0;
  border-bottom: 1px solid #808080;
}
.menu-bar span { margin-right: 12px; cursor: default; font-size: 12px; }
.toolbar {
  display: flex;
  align-items: center;
  padding: 2px 4px;
  background-color: #c0c0c0;
  border-bottom: 2px solid #808080;
}
.toolbar button, .search-button { margin-right: 4px; }
.search-button {
  display: flex;
  align-items: center;
  border: 1px solid #808080;
  background-color: #fff;
  padding: 0 4px;
  cursor: pointer;
}
.search-button img { width: 16px; height: 16px; margin-right: 2px; }
.toolbar input.address-bar { flex: 1; padding: 2px; margin-right: 4px; }
.tabs {
  display: flex;
  border-bottom: 2px solid #808080;
  background-color: #e0e0e0;
  overflow-x: auto;
}
.tab {
  padding: 4px 8px;
  margin-right: 2px;
  border: 1px solid #808080;
  border-bottom: none;
  background-color: #d0d0d0;
  cursor: pointer;
  font-size: 12px;
}
.tab.active {
  background-color: white;
  font-weight: bold;
}
.content { flex: 1; border-top: none; overflow: hidden; }
.content iframe { width: 100%; height: 100%; border: none; }
body.inprivate .toolbar,
body.inprivate .tabs,
body.inprivate .content {
  background-color: #222;
  color: #fff;
  border-color: #555;
}
body.inprivate .tab {
  background-color: #333;
  color: #fff;
}
body.inprivate .tab.active {
  background-color: #000;
  font-weight: bold;
}
</style>
</head>
<body>
<div class="browser">
  <div class="title-bar">
    <img src="https://www.techjunkie.com/wp-content/uploads/2011/03/ie-old.png" alt="IE Icon">
    Windows Internet Explorer
  </div>
  <div class="menu-bar">
    <span>File</span>
    <span>Edit</span>
    <span>View</span>
    <span>Favorites</span>
    <span>Tools</span>
    <span>Help</span>
  </div>
  <div class="toolbar">
    <button id="back-btn">&lt; Back</button>
    <button id="forward-btn">Forward &gt;</button>
    <button id="refresh-btn">Refresh</button>
    <button id="home-btn">Home</button>
    <button id="newtab-btn">New Tab</button>
    <input type="text" id="address-bar" class="address-bar" value="https://www.google.com/webhp?igu=1&safe=active&ssui=on&zx=1777241043420">
    <div class="search-button" id="search-btn">
      <img src="https://www.clipartmax.com/png/small/108-1087899_google-mobile-app-google-mobile-app-icon.png" alt="Google">
      Google
    </div>
    <button id="inprivate-btn">InPrivate</button>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab active" data-url="https://www.google.com/webhp?igu=1&safe=active&ssui=on&zx=1777241043420">Google</div>
  </div>
  <div class="content" id="tab-content">
    <iframe id="main-iframe" src="https://www.google.com/webhp?igu=1&safe=active&ssui=on&zx=1777241043420"></iframe>
  </div>
</div>

<script>
let tabHistory = [{back: [], forward: [], url: "https://www.google.com/webhp?igu=1&safe=active&ssui=on&zx=1777241043420", label: "Google"}];
let activeTabIndex = 0;

const iframe = document.getElementById('main-iframe');
const tabsContainer = document.getElementById('tabs');
const addressBar = document.getElementById('address-bar');

function updateTab() {
  const tab = tabsContainer.children[activeTabIndex];
  tab.dataset.url = tabHistory[activeTabIndex].url;
  tab.textContent = tabHistory[activeTabIndex].label;
  iframe.src = tabHistory[activeTabIndex].url;
  addressBar.value = tabHistory[activeTabIndex].url;
  Array.from(tabsContainer.children).forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
}

// Tab click
tabsContainer.addEventListener('click', e => {
  if(e.target.classList.contains('tab')) {
    activeTabIndex = Array.from(tabsContainer.children).indexOf(e.target);
    updateTab();
  }
});

// Address bar navigation
addressBar.addEventListener('keydown', e => {
  if(e.key === 'Enter') {
    let url = addressBar.value.trim();
    if(!url.startsWith('http')) url = 'https://' + url;
    tabHistory[activeTabIndex].back.push(tabHistory[activeTabIndex].url);
    tabHistory[activeTabIndex].forward = [];
    tabHistory[activeTabIndex].url = url;
    tabHistory[activeTabIndex].label = "New Tab"; // if not Google
    if(activeTabIndex === 0 && url.includes("google.com")) tabHistory[activeTabIndex].label = "Google";
    updateTab();
  }
});

// Search button
document.getElementById('search-btn').addEventListener('click', () => {
  const query = addressBar.value.trim();
  if(query) {
    const searchURL = `https://www.google.com/search?q=${encodeURIComponent(query)}&igu=1&safe=active&ssui=on&zx=${Date.now()}`;
    tabHistory[activeTabIndex].back.push(tabHistory[activeTabIndex].url);
    tabHistory[activeTabIndex].forward = [];
    tabHistory[activeTabIndex].url = searchURL;
    tabHistory[activeTabIndex].label = "Google";
    updateTab();
  }
});

// New Tab button
document.getElementById('newtab-btn').addEventListener('click', () => {
  const newTab = document.createElement('div');
  newTab.classList.add('tab');
  const url = 'https://example.com';
  newTab.dataset.url = url;
  newTab.textContent = 'New Tab';
  tabsContainer.appendChild(newTab);
  tabHistory.push({back: [], forward: [], url: url, label: 'New Tab'});
  activeTabIndex = tabHistory.length - 1;
  updateTab();
});

// Back button
document.getElementById('back-btn').addEventListener('click', () => {
  const history = tabHistory[activeTabIndex];
  if(history.back.length) {
    history.forward.push(history.url);
    history.url = history.back.pop();
    updateTab();
  }
});

// Forward button
document.getElementById('forward-btn').addEventListener('click', () => {
  const history = tabHistory[activeTabIndex];
  if(history.forward.length) {
    history.back.push(history.url);
    history.url = history.forward.pop();
    updateTab();
  }
});

// Refresh
document.getElementById('refresh-btn').addEventListener('click', () => updateTab());

// Home
document.getElementById('home-btn').addEventListener('click', () => {
  const homeURL = 'https://www.google.com/webhp?igu=1&safe=active&ssui=on&zx=1777241043420';
  tabHistory[activeTabIndex].back.push(tabHistory[activeTabIndex].url);
  tabHistory[activeTabIndex].forward = [];
  tabHistory[activeTabIndex].url = homeURL;
  tabHistory[activeTabIndex].label = "Google";
  updateTab();
});

// InPrivate
document.getElementById('inprivate-btn').addEventListener('click', () => {
  document.body.classList.toggle('inprivate');
});
</script>
</body>
</html>
